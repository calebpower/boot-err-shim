[project]
name = "boot-err-shim"
version = "0.1.0"
description = "Watch a host, and press 'Y' at the PERC flash-failure prompt so it finishes booting."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Caleb L. Power" }]
keywords = ["perc", "idrac", "vnc", "rfb", "freebsd", "monitoring"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: BSD :: FreeBSD",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Topic :: System :: Monitoring",
]

# Intentionally empty, and enforced by tests/structural/test_stdlib_only.py.
# The zipapp bundle produced by `make bundle` is only valid because nothing
# outside the standard library is imported at runtime.
dependencies = []

[project.scripts]
boot-err-shim = "boot_err_shim.cli:main"

[project.urls]
Homepage = "https://github.com/calebpower/boot-err-shim"

[dependency-groups]
dev = ["ruff>=0.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boot_err_shim"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
